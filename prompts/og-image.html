<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>OG Image — Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #050510;
    font-family: 'JetBrains Mono', monospace;
    color: #e0f7fa;
  }

  .stage {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    isolation: isolate;
  }

  /* Fondo con degradados cyberpunk */
  .bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 15% 20%,
        rgba(0, 255, 247, 0.22), transparent 65%),
      radial-gradient(ellipse 60% 50% at 85% 80%,
        rgba(255, 0, 229, 0.18), transparent 65%),
      linear-gradient(180deg, #000 0%, #050510 55%, #0a0a1a 100%);
    z-index: 0;
  }

  /* Rejilla sutil */
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(0, 255, 247, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 255, 247, 0.06) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse at 50% 50%, black 30%, transparent 80%);
    z-index: 1;
  }

  /* Scanlines sutiles */
  .scanlines {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent 0,
      transparent 3px,
      rgba(0, 255, 247, 0.04) 3px,
      rgba(0, 255, 247, 0.04) 4px
    );
    z-index: 2;
    pointer-events: none;
  }

  /* Ciudad Art Déco de fondo (silueta) */
  .city {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 55%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 0;
    z-index: 2;
    opacity: 0.55;
  }

  .tower {
    background: linear-gradient(180deg, #0a0a1a 0%, #1a0033 70%, #000 100%);
    border-top: 1px solid rgba(0, 255, 247, 0.35);
    position: relative;
  }

  .tower::before {
    content: "";
    position: absolute;
    inset: 15% 25%;
    background-image: radial-gradient(circle, #00fff7 1.5px, transparent 2px);
    background-size: 12px 16px;
    opacity: 0.85;
    mask-image: linear-gradient(180deg, black, transparent 90%);
  }

  .tower:nth-child(1) { width: 110px; height: 40%; }
  .tower:nth-child(2) { width: 130px; height: 55%; }
  .tower:nth-child(3) { width: 160px; height: 75%; }
  .tower:nth-child(4) { width: 180px; height: 100%; }
  .tower:nth-child(5) { width: 160px; height: 75%; }
  .tower:nth-child(6) { width: 130px; height: 55%; }
  .tower:nth-child(7) { width: 110px; height: 40%; }

  /* Contenido */
  .content {
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    justify-content: center;
    height: 100%;
    padding: 80px 90px;
    max-width: 75%;
  }

  /* Eyebrow */
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: #00fff7;
    margin-bottom: 28px;
    text-shadow: 0 0 12px rgba(0, 255, 247, 0.5);
  }

  .eyebrow::before {
    content: "";
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #00fff7;
    border-radius: 50%;
    margin-right: 12px;
    vertical-align: middle;
    box-shadow: 0 0 10px #00fff7;
    animation: blink 1.6s steps(2, start) infinite;
  }

  @keyframes blink { to { opacity: 0.2 } }

  /* Nombre */
  .name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 130px;
    line-height: 0.9;
    letter-spacing: 0.02em;
    color: #ffffff;
    text-transform: uppercase;
    text-shadow:
      0 0 40px rgba(0, 255, 247, 0.4),
      0 0 80px rgba(255, 0, 229, 0.25);
    margin-bottom: 8px;
  }

  .name span {
    display: block;
    color: #ff00e5;
    text-shadow:
      0 0 30px rgba(255, 0, 229, 0.7),
      0 0 60px rgba(255, 0, 229, 0.4);
  }

  /* Subtítulo */
  .role {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #7a90b0;
    margin-top: 22px;
  }

  .role::after {
    content: "▌";
    color: #00fff7;
    margin-left: 6px;
    animation: blink 1s steps(2, start) infinite;
  }

  /* Línea decorativa */
  .divider {
    width: 80px;
    height: 2px;
    background: linear-gradient(90deg, #00fff7, #ff00e5);
    margin: 28px 0;
    box-shadow: 0 0 15px rgba(0, 255, 247, 0.7);
  }

  /* URL esquina inferior */
  .url {
    position: absolute;
    bottom: 32px;
    right: 90px;
    z-index: 6;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.3em;
    color: #00fff7;
    text-transform: uppercase;
    text-shadow: 0 0 10px rgba(0, 255, 247, 0.6);
  }

  .url::before {
    content: "//  ";
    color: #ff00e5;
    opacity: 0.8;
  }

  /* Sello JS esquina superior derecha */
  .seal {
    position: absolute;
    top: 40px;
    right: 90px;
    z-index: 6;
    width: 64px;
    height: 64px;
    border: 1.5px solid #00fff7;
    display: grid;
    place-items: center;
    transform: rotate(45deg);
    box-shadow:
      0 0 20px rgba(0, 255, 247, 0.5),
      inset 0 0 20px rgba(0, 255, 247, 0.15);
  }

  .seal::after {
    content: "";
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(255, 0, 229, 0.6);
  }

  .seal span {
    transform: rotate(-45deg);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    color: #ffffff;
    letter-spacing: 0.04em;
    text-shadow: 0 0 12px rgba(0, 255, 247, 0.8);
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="bg"></div>
    <div class="grid"></div>
    <div class="city">
      <div class="tower"></div>
      <div class="tower"></div>
      <div class="tower"></div>
      <div class="tower"></div>
      <div class="tower"></div>
      <div class="tower"></div>
      <div class="tower"></div>
    </div>
    <div class="scanlines"></div>

    <div class="seal"><span>JS</span></div>

    <div class="content">
      <p class="eyebrow">Portafolio · DAM</p>
      <h1 class="name">
        Javier
        <span>Sansano</span>
      </h1>
      <div class="divider"></div>
      <p class="role">Estudiante de DAM</p>
    </div>

    <div class="url">javiersansano222.github.io/mi-web</div>
  </div>
</body>
</html>
