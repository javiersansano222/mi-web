<!doctype html>
<html lang="es" data-era="oro-noche" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a1220">
  <title>Mensaje enviado — Javier Sansano</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">

  <style>
    /* --- Estilos solo para esta página de gracias --- */
    .gracias-wrap{
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 40px 20px;
      text-align: center;
      position: relative;
      z-index: 1;
    }
    .gracias-card{
      max-width: 560px;
      width: 100%;
      padding: 60px 40px;
      border: 1px solid var(--gold);
      outline: 1px solid color-mix(in srgb, var(--gold) 30%, transparent);
      outline-offset: 6px;
      background: var(--panel);
      position: relative;
      backdrop-filter: blur(10px);
    }
    /* Esquinas Art Déco */
    .gracias-card::before,
    .gracias-card::after{
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      pointer-events: none;
    }
    .gracias-card::before{
      top: 6px; left: 6px;
      border-top: 1px solid var(--gold);
      border-left: 1px solid var(--gold);
    }
    .gracias-card::after{
      bottom: 6px; right: 6px;
      border-bottom: 1px solid var(--gold);
      border-right: 1px solid var(--gold);
    }

    .gracias-icon{
      font-size: 44px;
      color: var(--gold-bright);
      margin-bottom: 22px;
      text-shadow:
        0 0 12px var(--gold),
        0 0 28px color-mix(in srgb, var(--ember) 60%, transparent);
      animation: gracias-pulse 2.6s ease-in-out infinite;
    }
    @keyframes gracias-pulse{
      0%, 100%{ transform: scale(1); opacity: 1 }
      50%     { transform: scale(1.08); opacity: .85 }
    }

    .gracias-card h1{
      font: 400 clamp(32px, 5vw, 48px)/1.1 var(--serif);
      text-transform: uppercase;
      letter-spacing: .03em;
      margin: 0 0 18px;
      color: #ffffff;
    }
    .gracias-card h1 em{
      color: var(--gold-bright);
      font-style: normal;
      font-weight: 500;
    }

    .gracias-card p{
      font-size: 15px;
      line-height: 1.9;
      color: #e0e6ee;
      margin: 0 0 32px;
    }

    .gracias-divider{
      width: 60px;
      height: 1px;
      background: var(--gold);
      margin: 0 auto 26px;
      box-shadow: 0 0 8px var(--gold);
    }

    .gracias-actions{
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .gracias-back{
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      border: 1px solid var(--line);
      color: var(--muted);
      font: 500 10px var(--serif);
      letter-spacing: .18em;
      text-transform: uppercase;
      transition: border-color .25s, color .25s;
    }
    .gracias-back:hover{
      border-color: var(--gold-bright);
      color: var(--gold-bright);
    }
  </style>
</head>

<body>

  <!-- Fondo Art Déco reutilizado -->
  <div class="ocean" aria-hidden="true">
    <div class="ocean__glow"></div>
    <div class="ocean__grain"></div>
    <div class="bubble bubble--one"></div>
    <div class="bubble bubble--two"></div>
    <div class="bubble bubble--three"></div>
    <div class="bubble bubble--four"></div>
  </div>

  <main class="gracias-wrap">
    <div class="gracias-card">
      <div class="gracias-icon" aria-hidden="true">✦</div>

      <h1>Mensaje<br><em>enviado.</em></h1>

      <div class="gracias-divider" aria-hidden="true"></div>

      <p>
        Gracias por escribirme. He recibido tu mensaje
        y te responderé lo antes posible.
      </p>

      <div class="gracias-actions">
        <a class="button button--gold" href="index.html">
          Volver al inicio <span aria-hidden="true">←</span>
        </a>
      </div>
    </div>
  </main>

</body>
</html>
